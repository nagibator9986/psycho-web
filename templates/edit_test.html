{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Редактировать тест</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label for="title" class="form-label">Название теста</label>
            <input type="text" class="form-control" id="title" name="title" value="{{ test.title }}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Описание</label>
            <textarea class="form-control" id="description" name="description" rows="3">{{ test.description or '' }}</textarea>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {% if test.is_active %}checked{% endif %}>
            <label class="form-check-label" for="is_active">Тест активен</label>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
